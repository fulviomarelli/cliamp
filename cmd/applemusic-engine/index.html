<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Apple Music Engine</title>
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
    <script>
        // Command queue for commands sent before MusicKit is ready
        window.amQueue = [];
        window.musicReady = false;

        function processQueue() {
            console.log("JS: Processing queue, length: " + window.amQueue.length);
            while (window.amQueue.length > 0) {
                var cmd = window.amQueue.shift();
                cmd();
            }
        }

        // Bridge functions
        window.amPlay = function(id) {
            console.log("JS: amPlay requested for " + id);
            var fn = function() {
                console.log("JS: Executing play for " + id);
                window.music.setQueue({ song: id }).then(function() {
                    return window.music.play();
                }).catch(function(e) { console.error("JS: Play error: " + e); });
            };
            if (window.musicReady) { fn(); } else { window.amQueue.push(fn); }
        };

        window.amPause = function() {
            var fn = function() { window.music.pause(); };
            if (window.musicReady) { fn(); } else { window.amQueue.push(fn); }
        };

        window.amResume = function() {
            var fn = function() { window.music.play(); };
            if (window.musicReady) { fn(); } else { window.amQueue.push(fn); }
        };

        window.amSeek = function(time) {
            var fn = function() { window.music.seekToTime(time); };
            if (window.musicReady) { fn(); } else { window.amQueue.push(fn); }
        };

        function initAudioContext(audio) {
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                var source = audioCtx.createMediaElementSource(audio);
                var processor = audioCtx.createScriptProcessor(4096, 2, 2);
                source.connect(processor);
                processor.connect(audioCtx.destination);
                processor.onaudioprocess = function(e) {
                    var left = e.inputBuffer.getChannelData(0);
                    var right = e.inputBuffer.getChannelData(1);
                    var pcm = new Int16Array(left.length * 2);
                    for (var i = 0; i < left.length; i++) {
                        pcm[i * 2] = Math.max(-1, Math.min(1, left[i])) * 32767;
                        pcm[i * 2 + 1] = Math.max(-1, Math.min(1, right[i])) * 32767;
                    }
                    var bytes = new Uint8Array(pcm.buffer);
                    var binary = '';
                    for (var j = 0; j < bytes.byteLength; j++) { binary += String.fromCharCode(bytes[j]); }
                    if (window.onAudio) {
                        window.onAudio(btoa(binary));
                    } else {
                        fetch('/audio', { method: 'POST', body: btoa(binary) }).catch(e => console.error(e));
                    }
                };
                console.log("JS: Audio capture active");
            } catch (err) {
                console.error("JS: Audio context error: " + err);
            }
        }

        window.setupMusicKit = function(developerToken, storefront) {
            console.log("JS: Configuring MusicKit...");
            MusicKit.configure({
                developerToken: developerToken,
                app: { name: 'cliamp', build: '1.0.0' }
            }).then(function() {
                console.log("JS: MusicKit configured successfully");
                window.music = MusicKit.getInstance();
                window.musicReady = true;
                document.getElementById('status').innerText = 'Ready';
                
                var timer = setInterval(function() {
                    var audio = document.querySelector('audio');
                    if (audio) {
                        clearInterval(timer);
                        initAudioContext(audio);
                    }
                }, 500);

                if (!window.music.isAuthorized) {
                    document.getElementById('auth-section').style.display = 'block';
                }
                processQueue();
            }).catch(function(err) {
                console.error("JS: MusicKit init failed: " + err);
                document.getElementById('status').innerText = 'Error: ' + err.message;
                if (err.message.indexOf("token") !== -1) {
                    document.getElementById('token-err').style.display = 'block';
                }
            });
        };

        window.onload = function() {
            console.log("JS: Page loaded");
            if (window.onLoaded) window.onLoaded();
        };
    </script>
</head>
<body style="background: #111; color: #eee; font-family: sans-serif; text-align: center; padding: 20px;">
    <div id="status" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">Initializing...</div>
    
    <div id="auth-section" style="display:none;">
        <p>Please sign in to your Apple Music account.</p>
        <button onclick="window.music.authorize().then(function(){ document.getElementById('auth-section').style.display='none'; })" 
                style="padding: 12px 24px; font-size: 16px; background: #fa243c; color: white; border: none; border-radius: 6px; cursor: pointer;">
            Sign In
        </button>
    </div>

    <div id="token-err" style="display:none; color: #ff4444; border: 1px solid #ff4444; padding: 10px; margin-top: 20px; border-radius: 4px;">
        <strong>Invalid Token!</strong><br>
        Your <code>web_bearer_token</code> is expired or incorrect.<br>
        Run <code>go run scripts/apple-music-auth-go/apple_music_login.go</code> to refresh.
    </div>
    
    <p style="font-size: 12px; color: #666; margin-top: 40px;">This window must remain open for Apple Music playback.</p>
</body>
</html>
